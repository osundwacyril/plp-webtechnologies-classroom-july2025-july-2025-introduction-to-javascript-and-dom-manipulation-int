<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Fundamentals Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mastering JavaScript Fundamentals</h1>
    </header>

    <main>
        <section id="part1">
            <h2>🎯 Part 1: JavaScript Basics</h2>
            <p>Enter a number to check if it's even or odd:</p>
            <input type="number" id="numberInput" placeholder="Enter a number">
            <button id="checkNumberBtn">Check Number</button>
            <p id="resultOutput">Result will appear here.</p>
        </section>
        
        <hr>

        <section id="part2">
            <h2>❤️ Part 2: JavaScript Functions</h2>
            <button id="showCalculation">Calculate Total Price</button>
            <p id="calculationResult"></p>
        </section>
        
        <hr>

        <section id="part3">
            <h2>🔁 Part 3: JavaScript Loops</h2>
            <ul id="listContainer">
                </ul>
        </section>

        <hr>

        <section id="part4">
            <h2>🌐 Part 4: Mastering the DOM</h2>
            <button id="toggleBtn">Toggle Content</button>
            <p id="toggleText" class="hidden">This text can be shown or hidden.</p>
            
            <button id="createBtn">Create New Element</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
